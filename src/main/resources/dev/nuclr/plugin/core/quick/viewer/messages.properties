# English texts of the executable quick viewer plugin, read through Messages.tr(...).
# Translations: messages_<language>.properties with the same keys; a missing key falls back to this file.
# A text used with arguments ({0}, {1}...) is a MessageFormat pattern: write a literal apostrophe as ''.
# A text used without arguments is shown exactly as written.
# Header field names (Machine, Subsystem, Image Base, OS ABI, Load Commands...), section names,
# flag names, format names and platform names are not translated.

